name: Unzip pipeline code

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip pipeline_code.zip into the repo
        run: |
          if [ ! -f pipeline_code.zip ]; then
            echo "pipeline_code.zip not found at repo root — upload it first."
            exit 1
          fi
          unzip -o pipeline_code.zip -d .
          rm pipeline_code.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pipeline/
          git rm --cached pipeline_code.zip 2>/dev/null || true
          git commit -m "Add pipeline code (Task C)" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
