name: Mirror FNO bhavcopy

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Clone source repo
        run: git clone --depth 1 https://github.com/SantoshSrinivas79/NSE-FNO-Data-bank.git /tmp/source

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Copy and commit year by year
        run: |
          mkdir -p data/daily/fno_bhavcopy
          for year_dir in /tmp/source/data/*/; do
            year=$(basename "$year_dir")
            if [ -d "data/daily/fno_bhavcopy/$year" ] && [ "$(ls -A data/daily/fno_bhavcopy/$year 2>/dev/null)" ]; then
              echo "Year $year already present, skipping"
              continue
            fi
            mkdir -p "data/daily/fno_bhavcopy/$year"
            cp -r "$year_dir"* "data/daily/fno_bhavcopy/$year/"
            git add "data/daily/fno_bhavcopy/$year"
            git commit -m "Mirror FNO bhavcopy $year" || echo "Nothing to commit for $year"
            git pull --rebase origin main
            git push
          done
